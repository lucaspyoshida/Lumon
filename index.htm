<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lumon</title>
    <!-- O arquivo principal passou a ser index.html, porque servidores
         estáticos procuram esse nome ao servir a raiz de um diretório.
         Este arquivo continua existindo para não quebrar atalhos, favoritos
         e instalações do aplicativo que já apontavam para index.htm. -->
    <link rel="canonical" href="index.html">
    <meta http-equiv="refresh" content="0; url=index.html">
    <script>location.replace(new URL('index.html', location.href));</script>
</head>
<body>
    <p>Abrindo o Lumon… <a href="index.html">Toque aqui se não abrir sozinho.</a></p>
</body>
</html>
